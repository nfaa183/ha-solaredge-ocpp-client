configuration:
  server_address:
    name: Home Assistant address
    description: >-
      IP address or host name of Home Assistant, exactly as entered in the
      charger's "Central System Address". Used for the TLS certificate.
  upstream_url:
    name: SolarEdge OCPP server
    description: >-
      Base URL of the SolarEdge central system, as configured on the charger
      (host, port and path). The charge point identity is appended automatically.
network:
  9010/tcp: OCPP endpoint for the charger (capture mode)
